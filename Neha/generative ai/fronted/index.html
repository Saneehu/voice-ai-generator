<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Zero To Hero AI Assistant</title>


<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}


body{

    height:100vh;
    background:linear-gradient(
        135deg,
        #667eea,
        #764ba2
    );

    display:flex;
    justify-content:center;
    align-items:center;

}


/* Main Chat Container */

.chat-container{

    width:420px;
    height:650px;

    background:white;

    border-radius:20px;

    display:flex;
    flex-direction:column;

    overflow:hidden;

    box-shadow:
    0px 15px 40px rgba(0,0,0,0.25);

}



/* Header */

.header{

    background:#4f46e5;

    color:white;

    padding:20px;

    text-align:center;

}


.header h2{

    font-size:22px;

}

.header p{

    font-size:13px;
    opacity:0.8;

}



/* Chat messages area */


.chat-box{

    flex:1;

    padding:20px;

    overflow-y:auto;

    background:#f8fafc;

}



.message{

    max-width:75%;

    padding:12px 15px;

    margin-bottom:15px;

    border-radius:15px;

    line-height:1.5;

    font-size:15px;

}


.user{

    background:#4f46e5;

    color:white;

    margin-left:auto;

    border-bottom-right-radius:2px;

}


.bot{

    background:#e5e7eb;

    color:#111827;

    margin-right:auto;

    border-bottom-left-radius:2px;

}



/* Input section */


.input-area{

    display:flex;

    padding:15px;

    border-top:1px solid #ddd;

    background:white;

}



input{

    flex:1;

    padding:12px;

    border-radius:25px;

    border:1px solid #ccc;

    outline:none;

    font-size:15px;

}



button{


    margin-left:10px;

    width:50px;

    border:none;

    border-radius:50%;

    background:#4f46e5;

    color:white;

    cursor:pointer;

    font-size:18px;

}


button:hover{

    background:#3730a3;

}



.loader{

display:none;

font-size:13px;

color:#555;

margin-bottom:10px;

}


</style>


</head>



<body>



<div class="chat-container">


<div class="header">

<h2>🤖 Zero To Hero AI</h2>

<p>Chat with your PDF using Groq LLM</p>

</div>



<div id="chatBox" class="chat-box">


<div class="message bot">

Hello 👋

Upload your PDF and ask me anything about it.

</div>


</div>



<div class="input-area">


<input 
id="userInput"
placeholder="Ask something from your PDF..."
onkeypress="handleEnter(event)"
/>


<button onclick="sendMessage()">
➤
</button>


</div>



</div>





<script>


const API_URL =
"http://127.0.0.1:8000/chat";



function handleEnter(event){

    if(event.key==="Enter"){

        sendMessage();

    }

}




function addMessage(message,type){

    let chatBox=document.getElementById("chatBox");


    let div=document.createElement("div");


    div.className="message "+type;


    div.innerText=message;


    chatBox.appendChild(div);


    chatBox.scrollTop=
    chatBox.scrollHeight;


}




async function sendMessage(){


let input=document.getElementById("userInput");


let question=input.value.trim();



if(question==="")
return;



// show user message

addMessage(question,"user");


input.value="";



// temporary loading

let loading=document.createElement("div");

loading.className="message bot";

loading.innerText="Thinking... 🤔";

document
.getElementById("chatBox")
.appendChild(loading);



try{


let response=await fetch(API_URL,{

method:"POST",

headers:{

"Content-Type":"application/json"

},


body:JSON.stringify({

question:question

})


});



let data=await response.json();


// remove loading

loading.remove();



// show answer

addMessage(
data.answer,
"bot"
);



}


catch(error){


loading.remove();


addMessage(

"❌ Server error. Make sure main.py is running",

"bot"

);


console.log(error);


}



}



</script>



</body>

</html>
